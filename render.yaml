services:
  # ----------------- Backend Web Service -----------------
  - type: web
    name: yt-trending-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"

  # ----------------- Frontend Static Site -----------------
  - type: web
    name: yt-trending-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: yt-trending-backend
          property: host
